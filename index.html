<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Commerce Studio, loja virtual demonstrativa com vitrine, carrossel, estoque e painel de gestão."
    />
    <meta http-equiv="refresh" content="0; url=iprime-store/index.html" />
    <title>Commerce Studio | Abrindo loja demonstrativa</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #151517;
        background: #f5f5f7;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 32px, 560px);
        padding: 32px;
        border: 1px solid rgba(20, 20, 24, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 70px rgba(21, 21, 23, 0.1);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 34px;
        line-height: 1;
      }

      p {
        margin: 0 0 22px;
        color: #6e6e73;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 999px;
        color: #fff;
        background: #0071e3;
        font-weight: 750;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Commerce Studio</h1>
      <p>Abrindo a loja virtual demonstrativa com vitrine, carrossel, modo claro/escuro e gestão de estoque.</p>
      <a href="iprime-store/index.html">Abrir loja</a>
    </main>
    <script>
      window.location.replace("iprime-store/index.html");
    </script>
  </body>
</html>
